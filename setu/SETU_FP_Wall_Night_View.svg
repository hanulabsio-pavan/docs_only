<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family="Arial, Helvetica, sans-serif">
  <rect width="1080" height="600" fill="#ffffff"/>
  <text x="540" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E2761">SETU-4G Installed — day and night</text>
  <text x="540" y="57" text-anchor="middle" font-size="12" fill="#6B7490">Elevation, premium living room wall · panel center at 1.25 m · person 1.7 m for scale</text>

  <!-- ============ DAY ============ -->
  <g transform="translate(30,80)">
    <rect x="0" y="0" width="500" height="440" fill="#F7F5F1"/>
    <!-- floor + skirting -->
    <rect x="0" y="400" width="500" height="40" fill="#E4DCCF"/>
    <rect x="0" y="392" width="500" height="8" fill="#D8CFC0"/>
    <!-- door frame -->
    <rect x="40" y="60" width="120" height="332" fill="#EFEBE3" stroke="#C9BFAE" stroke-width="2"/>
    <rect x="52" y="72" width="96" height="320" fill="#E7E1D5"/>
    <!-- wood console -->
    <rect x="330" y="330" width="150" height="10" fill="#A98C6B"/>
    <rect x="345" y="340" width="8" height="52" fill="#A98C6B"/>
    <rect x="457" y="340" width="8" height="52" fill="#A98C6B"/>
    <ellipse cx="405" cy="316" rx="26" ry="16" fill="#8FA98F"/>
    <rect x="400" y="316" width="10" height="16" fill="#C9BFAE"/>
    <!-- scale person -->
    <g stroke="#C9BFAE" stroke-width="2" fill="none">
      <circle cx="90" cy="152" r="12"/>
      <line x1="90" y1="164" x2="90" y2="240"/>
      <line x1="90" y1="185" x2="70" y2="215"/><line x1="90" y1="185" x2="110" y2="215"/>
      <line x1="90" y1="240" x2="76" y2="300"/><line x1="90" y1="240" x2="104" y2="300"/>
    </g>
    <!-- panel: 170x122mm at ~0.75 px/mm => 128x92, center at y-height 1.25m: floor at 400 => 1.25m ≈ 400-234 = 166 center -->
    <g transform="translate(216,120)">
      <rect x="-4" y="-4" width="136" height="100" rx="8" fill="#DED8CC"/> <!-- shadow gap -->
      <rect x="0" y="0" width="128" height="92" rx="7" fill="#FDFDFC" stroke="#C9CFDE" stroke-width="1"/>
      <g stroke="#9AA6C8" fill="none" stroke-width="0.6">
        <circle cx="26" cy="42" r="10"/><circle cx="51" cy="42" r="10"/>
        <circle cx="77" cy="42" r="10"/><circle cx="102" cy="42" r="10"/>
      </g>
      <circle cx="64" cy="75" r="7" fill="none" stroke="#C9A227" stroke-width="0.7"/>
    </g>
    <line x1="216" y1="166" x2="150" y2="166" stroke="#9AA6C8" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="146" y="170" text-anchor="end" font-size="11" fill="#6B7490">1.25 m</text>
    <text x="250" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Day — Pearl White fascia reads as architecture</text>
  </g>

  <!-- ============ NIGHT ============ -->
  <g transform="translate(550,80)">
    <rect x="0" y="0" width="500" height="440" fill="#141B2E"/>
    <rect x="0" y="400" width="500" height="40" fill="#0E1424"/>
    <!-- moonlight window glow -->
    <rect x="40" y="60" width="120" height="332" fill="#1B2440"/>
    <!-- bed hint -->
    <rect x="320" y="330" width="170" height="62" rx="8" fill="#1D2742"/>
    <rect x="330" y="310" width="60" height="26" rx="6" fill="#222D4C"/>
    <!-- panel glowing -->
    <g transform="translate(216,120)">
      <rect x="-4" y="-4" width="136" height="100" rx="8" fill="#0E1424"/>
      <rect x="0" y="0" width="128" height="92" rx="7" fill="#1A2136" stroke="#2A3350" stroke-width="1"/>
      <!-- locator glow dots -->
      <g>
        <circle cx="26" cy="26" r="4" fill="#FFE9B8" opacity="0.25"/>
        <circle cx="26" cy="26" r="1.6" fill="#FFE9B8"/>
        <circle cx="51" cy="26" r="4" fill="#FFE9B8" opacity="0.6"/>
        <circle cx="51" cy="26" r="2.2" fill="#FFEFC9"/>
        <circle cx="77" cy="26" r="1.4" fill="#8a7d55"/>
        <circle cx="102" cy="26" r="1.4" fill="#8a7d55"/>
      </g>
      <g stroke="#3A4468" fill="none" stroke-width="0.6">
        <circle cx="26" cy="42" r="10"/><circle cx="51" cy="42" r="10"/>
        <circle cx="77" cy="42" r="10"/><circle cx="102" cy="42" r="10"/>
      </g>
      <circle cx="64" cy="75" r="7" fill="none" stroke="#6d5c2a" stroke-width="0.7"/>
    </g>
    <!-- soft light spill from gang2 load (bedside lamp) -->
    <ellipse cx="360" cy="300" rx="70" ry="40" fill="#FFE9B8" opacity="0.08"/>
    <text x="250" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Night — ≤1% locator glow; gang 2 on at 35%; zones findable by etched ring texture</text>
  </g>
</svg>
