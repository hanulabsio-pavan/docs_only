<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="Arial, Helvetica, sans-serif">
  <rect width="1080" height="620" fill="#ffffff"/>
  <text x="540" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E2761">SETU LED Behavior — state examples</text>
  <text x="540" y="60" text-anchor="middle" font-size="12" fill="#6B7490">Firmware basis: led_status.h wifi_led_mode_t + PWM gang LEDs · warm white 2700–3000 K, amber for attention · never blue</text>

  <defs>
    <g id="miniP">
      <rect x="0" y="0" width="220" height="158" rx="10" fill="#23293F" stroke="#1E2761" stroke-width="1.5"/>
      <g stroke="#4a5578" fill="none" stroke-width="0.8">
        <circle cx="44" cy="72" r="17"/><circle cx="88" cy="72" r="17"/>
        <circle cx="132" cy="72" r="17"/><circle cx="176" cy="72" r="17"/>
      </g>
      <circle cx="110" cy="126" r="12" fill="none" stroke="#4a5578" stroke-width="0.9"/>
    </g>
  </defs>

  <!-- row 1 -->
  <g transform="translate(50,90)">
    <use href="#miniP"/>
    <g fill="#8a7d55"><circle cx="44" cy="45" r="2"/><circle cx="88" cy="45" r="2"/><circle cx="132" cy="45" r="2"/><circle cx="176" cy="45" r="2"/></g>
    <text x="110" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Idle · locator glow 6%</text>
    <text x="110" y="196" text-anchor="middle" font-size="11" fill="#6B7490">configurable 0–15%, off in night mode</text>
  </g>
  <g transform="translate(310,90)">
    <use href="#miniP"/>
    <g><circle cx="44" cy="45" r="3.5" fill="#FFE9B8"/><circle cx="88" cy="45" r="2" fill="#8a7d55"/><circle cx="132" cy="45" r="3.5" fill="#FFE9B8"/><circle cx="176" cy="45" r="2" fill="#8a7d55"/></g>
    <text x="110" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Loads on · 35% steady</text>
    <text x="110" y="196" text-anchor="middle" font-size="11" fill="#6B7490">gangs 1 &amp; 3 on — state at a glance</text>
  </g>
  <g transform="translate(570,90)">
    <use href="#miniP"/>
    <g><circle cx="88" cy="45" r="6" fill="#FFF3D6"/><circle cx="88" cy="45" r="3.5" fill="#FFD97A"/><circle cx="44" cy="45" r="2" fill="#8a7d55"/><circle cx="132" cy="45" r="2" fill="#8a7d55"/><circle cx="176" cy="45" r="2" fill="#8a7d55"/></g>
    <circle cx="88" cy="72" r="17" fill="none" stroke="#C9A227" stroke-width="1.2"/>
    <text x="110" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Touch feedback</text>
    <text x="110" y="196" text-anchor="middle" font-size="11" fill="#6B7490">pulse to 100%, 400 ms decay + relay click</text>
  </g>
  <g transform="translate(830,90)">
    <use href="#miniP"/>
    <g fill="#FFE9B8"><circle cx="44" cy="45" r="2.6"/><circle cx="88" cy="45" r="3.4"/><circle cx="132" cy="45" r="2.6"/><circle cx="176" cy="45" r="2"/></g>
    <circle cx="110" cy="126" r="12" fill="none" stroke="#C9A227" stroke-width="1.5"/>
    <text x="110" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Theme applied</text>
    <text x="110" y="196" text-anchor="middle" font-size="11" fill="#6B7490">one 30 Hz sweep, then scene-table levels</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(50,330)">
    <use href="#miniP"/>
    <rect x="130" y="124" width="14" height="3" rx="1.5" fill="#E8B84B"/>
    <rect x="127" y="121" width="20" height="9" rx="4" fill="none" stroke="#E8B84B" stroke-width="0.8" opacity="0.5"/>
    <text x="110" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Provisioning / setup</text>
    <text x="110" y="196" text-anchor="middle" font-size="11" fill="#6B7490">status hairline: slow amber breathe</text>
  </g>
  <g transform="translate(310,330)">
    <use href="#miniP"/>
    <rect x="130" y="124" width="14" height="3" rx="1.5" fill="#E8B84B"/>
    <rect x="152" y="124" width="6" height="3" rx="1.5" fill="#E8B84B" opacity="0.5"/>
    <text x="110" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">OTA update</text>
    <text x="110" y="196" text-anchor="middle" font-size="11" fill="#6B7490">gentle double-blink · loads unaffected</text>
  </g>
  <g transform="translate(570,330)">
    <use href="#miniP"/>
    <rect x="126" y="124" width="5" height="3" rx="1.5" fill="#E8B84B"/>
    <rect x="134" y="124" width="5" height="3" rx="1.5" fill="#E8B84B"/>
    <rect x="142" y="124" width="5" height="3" rx="1.5" fill="#E8B84B"/>
    <text x="110" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Fault</text>
    <text x="110" y="196" text-anchor="middle" font-size="11" fill="#6B7490">distinct triple pattern · loads keep state</text>
  </g>
  <g transform="translate(830,330)">
    <use href="#miniP"/>
    <g fill="#5c543d"><circle cx="44" cy="45" r="1.2"/><circle cx="88" cy="45" r="1.2"/><circle cx="132" cy="45" r="1.2"/><circle cx="176" cy="45" r="1.2"/></g>
    <text x="110" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Night mode</text>
    <text x="110" y="196" text-anchor="middle" font-size="11" fill="#6B7490">locator ≤1% · feedback capped · bedroom-safe</text>
  </g>

  <text x="540" y="576" text-anchor="middle" font-size="12" fill="#6B7490">Connected = hairline solid 3 s then dark: a healthy SETU shows nothing. Network-loss = one soft amber pip / 10 s (suppressible). Cleaning lock = LEDs off, double-pulse if touched.</text>
  <text x="540" y="596" text-anchor="middle" font-size="12" fill="#6B7490">Panels drawn on dark background to show light behavior; physical panel colors per finish collection.</text>
</svg>
