<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="1080" height="640" fill="#ffffff"/>
  <text x="540" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E2761">SETU-4G — Exploded Construction Stack</text>
  <text x="540" y="60" text-anchor="middle" font-size="12" fill="#6B7490">Layers 1–4 bond into the field-replaceable fascia module · Design Spec v1.0 §7.2</text>

  <!-- exploded skewed layers, front (1) at top -->
  <g transform="translate(150,90)">
    <!-- each layer: skewed parallelogram 420 wide, 90 deep illusion -->
    <g id="layers">
      <!-- L1 glass -->
      <g transform="translate(0,0)">
        <path d="M60,60 L480,60 L540,20 L120,20 Z" fill="#EAF1FB" stroke="#1E2761" stroke-width="2"/>
        <text x="300" y="48" text-anchor="middle" font-size="12" fill="#1E2761" font-weight="bold">1 · Glass fascia 2.0 — chem-strengthened, AF coat, etched rings</text>
      </g>
      <!-- L2 ink -->
      <g transform="translate(0,62)">
        <path d="M60,60 L480,60 L540,20 L120,20 Z" fill="#1E2761" stroke="#1E2761" stroke-width="1.5"/>
        <text x="300" y="48" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2 · 2nd-surface ceramic ink — color, icon windows, LED apertures</text>
      </g>
      <!-- L3 OCA -->
      <g transform="translate(0,124)">
        <path d="M60,60 L480,60 L540,20 L120,20 Z" fill="#F7F3E6" stroke="#C9A227" stroke-width="1.5"/>
        <text x="300" y="48" text-anchor="middle" font-size="12" fill="#7a6414" font-weight="bold">3 · OCA lamination 0.2 — full-area, no air gap</text>
      </g>
      <!-- L4 light guide -->
      <g transform="translate(0,186)">
        <path d="M60,60 L480,60 L540,20 L120,20 Z" fill="#FDFDFE" stroke="#5a6480" stroke-width="1.5"/>
        <circle cx="200" cy="40" r="5" fill="none" stroke="#C9A227" stroke-width="1.4"/>
        <circle cx="260" cy="40" r="5" fill="none" stroke="#C9A227" stroke-width="1.4"/>
        <circle cx="320" cy="40" r="5" fill="none" stroke="#C9A227" stroke-width="1.4"/>
        <circle cx="380" cy="40" r="5" fill="none" stroke="#C9A227" stroke-width="1.4"/>
        <text x="300" y="58" text-anchor="middle" font-size="12" fill="#2A3350" font-weight="bold">4 · Light guide / diffuser 1.2 PC — LED wells + cross-talk baffles</text>
      </g>
      <!-- L5 gasket -->
      <g transform="translate(0,248)">
        <path d="M60,60 L480,60 L540,20 L120,20 Z" fill="#EDEFF4" stroke="#5a6480" stroke-width="1.5" stroke-dasharray="6 4"/>
        <text x="300" y="48" text-anchor="middle" font-size="12" fill="#2A3350" font-weight="bold">5 · Gasket — foam ring + conductive pads over electrodes (coupling, anti-rattle)</text>
      </g>
      <!-- L6 PCB -->
      <g transform="translate(0,310)">
        <path d="M60,60 L480,60 L540,20 L120,20 Z" fill="#E4F0E4" stroke="#2C5F2D" stroke-width="2"/>
        <circle cx="190" cy="40" r="12" fill="none" stroke="#2C5F2D" stroke-width="1.2" stroke-dasharray="3 2"/>
        <circle cx="255" cy="40" r="12" fill="none" stroke="#2C5F2D" stroke-width="1.2" stroke-dasharray="3 2"/>
        <circle cx="320" cy="40" r="12" fill="none" stroke="#2C5F2D" stroke-width="1.2" stroke-dasharray="3 2"/>
        <circle cx="385" cy="40" r="12" fill="none" stroke="#2C5F2D" stroke-width="1.2" stroke-dasharray="3 2"/>
        <rect x="440" y="26" width="70" height="18" fill="none" stroke="#2C5F2D" stroke-width="1.2"/>
        <text x="300" y="58" text-anchor="middle" font-size="12" fill="#1d421e" font-weight="bold">6 · PCB 140 × 100 — Cu touch electrodes (CS1–5), CAP1296, ESP32-S3 →</text>
      </g>
      <!-- L7 chassis -->
      <g transform="translate(0,372)">
        <path d="M60,60 L480,60 L540,20 L120,20 Z" fill="#DDE2EE" stroke="#1E2761" stroke-width="2"/>
        <text x="300" y="48" text-anchor="middle" font-size="12" fill="#1E2761" font-weight="bold">7 · Chassis + enclosure — PC/ABS UL94-V0, magnets ×6, HV zone, vents</text>
      </g>
    </g>
  </g>

  <!-- fascia module bracket -->
  <g stroke="#C9A227" stroke-width="2" fill="none">
    <path d="M104,110 L84,110 L84,428 L104,428"/>
  </g>
  <text x="74" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#C9A227" transform="rotate(-90 74 280)">FASCIA MODULE (replaceable)</text>

  <!-- annotations right -->
  <g font-size="12" fill="#2A3350">
    <text x="760" y="150" font-weight="bold" fill="#1E2761">Critical parameter</text>
    <text x="760" y="170">Total dielectric above electrodes</text>
    <text x="760" y="188" font-weight="bold">glass 2.0 + OCA 0.2 + guide 1.2 ≤ 3.4 mm</text>
    <text x="760" y="206">Validate: Stage-2 I2-1 / I2-2 (false-trigger &lt;5%)</text>

    <text x="760" y="250" font-weight="bold" fill="#1E2761">Keep-outs</text>
    <text x="760" y="270">· 15 mm antenna keep-out (all layers)</text>
    <text x="760" y="288">· no metal / magnets within 20 mm of antenna</text>
    <text x="760" y="306">· 4 mm creepage / 2.5 mm clearance HV↔LV</text>
    <text x="760" y="324">· PSU + relays away from electrodes &amp; mic</text>

    <text x="760" y="368" font-weight="bold" fill="#1E2761">Attachment</text>
    <text x="760" y="388">6 × N35 magnets + 2 alignment pins;</text>
    <text x="760" y="406">asymmetric pattern prevents wrong mounting;</text>
    <text x="760" y="424">removal via bottom notch + plastic tool.</text>

    <text x="760" y="468" font-weight="bold" fill="#1E2761">Bottom edge ports</text>
    <text x="760" y="488">mic Ø1.0 (Phase-2 voice) · reset pinhole Ø1.2</text>
  </g>
  <text x="540" y="614" text-anchor="middle" font-size="12" fill="#6B7490">All thicknesses in mm. Layers drawn separated for clarity; installed stack is fully bonded (1–4) and gasket-compressed (5).</text>
</svg>
