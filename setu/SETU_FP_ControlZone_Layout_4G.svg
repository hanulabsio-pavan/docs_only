<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,7 L7,1" stroke="#5a6480" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E2761">SETU-4G — Front Panel Control-Zone Layout (straight-on view)</text>
  <text x="500" y="62" text-anchor="middle" font-size="12" fill="#6B7490">Scale 4 px = 1 mm · dimensions in mm · Design Spec v1.0 §4</text>

  <!-- panel body -->
  <g>
    <rect x="160" y="90" width="680" height="488" rx="32" fill="#F4F6FB" stroke="#1E2761" stroke-width="2.5"/>
    <!-- shadow gap hint -->
    <rect x="172" y="102" width="656" height="464" rx="26" fill="none" stroke="#C9CFDE" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- gang zones: centers x=34/68/102/136mm, y=56mm ; r=13mm=52px -->
    <g stroke="#1E2761" fill="none">
      <circle cx="296" cy="314" r="52" stroke-width="1.6"/>
      <circle cx="432" cy="314" r="52" stroke-width="1.6"/>
      <circle cx="568" cy="314" r="52" stroke-width="1.6"/>
      <circle cx="704" cy="314" r="52" stroke-width="1.6"/>
    </g>
    <!-- light icons in zones -->
    <g stroke="#5a6480" stroke-width="2" fill="none">
      <g id="lampicon">
        <circle cx="296" cy="314" r="10"/>
        <line x1="296" y1="296" x2="296" y2="290"/><line x1="296" y1="332" x2="296" y2="338"/>
        <line x1="278" y1="314" x2="272" y2="314"/><line x1="314" y1="314" x2="320" y2="314"/>
      </g>
      <use href="#lampicon" x="136"/>
      <use href="#lampicon" x="272"/>
      <use href="#lampicon" x="408"/>
    </g>
    <!-- gang LED apertures: 8mm above ring top => y = 56-13-8 = 35mm -> 230px, r 1.8mm dia -> r=3.6 -->
    <g fill="#C9A227">
      <circle cx="296" cy="230" r="4"/><circle cx="432" cy="230" r="4"/>
      <circle cx="568" cy="230" r="4"/><circle cx="704" cy="230" r="4"/>
    </g>

    <!-- scene zone: (85,100)mm r=9mm=36px -->
    <circle cx="500" cy="490" r="36" fill="none" stroke="#C9A227" stroke-width="1.8"/>
    <g stroke="#C9A227" stroke-width="2" fill="none">
      <path d="M500,478 L503,487 L512,490 L503,493 L500,502 L497,493 L488,490 L497,487 Z"/>
    </g>
    <!-- status hairline right of scene: at ~ (99,100)mm -->
    <rect x="552" y="488" width="20" height="3" rx="1.5" fill="#9AA6C8"/>
    <!-- reserved CS6 position (unprinted) -->
    <circle cx="620" cy="490" r="30" fill="none" stroke="#C9CFDE" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- wordmark bottom-left ~ (18,112)mm -->
    <text x="215" y="546" font-size="13" letter-spacing="6" fill="#9AA6C8" font-weight="bold">SETU</text>
  </g>

  <!-- dimensions -->
  <g stroke="#5a6480" stroke-width="1.2" fill="none">
    <!-- overall width -->
    <line x1="160" y1="618" x2="840" y2="618" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="160" y1="582" x2="160" y2="624"/><line x1="840" y1="582" x2="840" y2="624"/>
    <!-- overall height -->
    <line x1="112" y1="90" x2="112" y2="578" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="106" y1="90" x2="164" y2="90"/><line x1="106" y1="578" x2="164" y2="578"/>
    <!-- zone pitch -->
    <line x1="296" y1="150" x2="432" y2="150" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="296" y1="150" x2="296" y2="226"/><line x1="432" y1="150" x2="432" y2="226"/>
    <!-- y of zone row -->
    <line x1="884" y1="90" x2="884" y2="314" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="838" y1="90" x2="890" y2="90"/><line x1="708" y1="314" x2="890" y2="314"/>
    <!-- zone dia leader -->
    <line x1="252" y1="358" x2="200" y2="420"/>
    <!-- scene dia leader -->
    <line x1="474" y1="516" x2="400" y2="596"/>
    <!-- corner radius leader -->
    <line x1="822" y1="108" x2="880" y2="70"/>
  </g>
  <g font-size="14" fill="#1E2761">
    <text x="500" y="640" text-anchor="middle" font-weight="bold">170</text>
    <text x="96" y="338" text-anchor="middle" font-weight="bold" transform="rotate(-90 96 338)">122</text>
    <text x="364" y="142" text-anchor="middle" font-weight="bold">34 pitch</text>
    <text x="908" y="206" text-anchor="middle" font-weight="bold" transform="rotate(-90 908 206)">56</text>
    <text x="196" y="440" text-anchor="end" font-size="13">Zone Ø26, micro-etched ring</text>
    <text x="394" y="602" text-anchor="end" font-size="13">Scene zone Ø18 (CS5)</text>
    <text x="884" y="62" text-anchor="middle" font-size="13">R8</text>
  </g>
  <g font-size="12" fill="#6B7490">
    <text x="296" y="212" text-anchor="middle">LED Ø1.8 warm white ×4</text>
    <text x="562" y="472">status hairline</text>
    <text x="620" y="538" text-anchor="middle">CS6 reserved (unprinted)</text>
    <text x="160" y="672" >Bottom edge (not visible in this view): mic port Ø1.0 · factory-reset pinhole Ø1.2 · fascia removal notch. Glass floats on 1.5 mm shadow gap (dashed line).</text>
  </g>
</svg>
