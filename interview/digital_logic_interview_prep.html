{c:"fsm",d:"easy",q:"What is the difference between a Moore FSM and a Mealy FSM? Give an example of when you'd choose each.",
a:`<strong>Moore FSM:</strong> Output depends ONLY on the current state.<br>
Output logic: <code>Output = f(State)</code><br>
Output changes only on state transitions (synchronous if output is registered).<br><br>
<strong>Mealy FSM:</strong> Output depends on BOTH the current state AND the current input.<br>
Output logic: <code>Output = f(State, Input)</code><br>
Output can change immediately when input changes (combinational output).<br><br>
<strong>Comparison:</strong><br>
<pre>
Property        Moore       Mealy
Output depends  State only  State + Input
# of states     More        Fewer (inputs fold in)
Output timing   State-synced  Async (input-driven)
Glitch risk     Lower        Higher (input glitch→output glitch)
</pre>
<strong>When to choose Moore:</strong><br>
- Output drives another synchronous block (no glitch tolerance)<br>
- Output is a control signal that must be stable for a full cycle<br>
- Safer default for RTL design<br><br>
<strong>When to choose Mealy:</strong><br>
- Need one-cycle faster response to input<br>
- Fewer states needed (simpler state encoding)<br>
- Serial protocol decoders (respond as soon as bit is received)<br><br>
<strong>RTL implementation:</strong> In Verilog, register the outputs of a Mealy FSM to convert it effectively to a Moore machine (eliminates glitch risk at cost of 1 cycle latency).`},

{c:"fsm",d:"med",q:"Design a sequence detector FSM that detects the pattern '1011' in a serial bit stream (overlapping detection allowed).",
a:`<strong>States:</strong> S0=idle, S1=got 1, S2=got 10, S3=got 101, S4=got 1011(=detect)<br><br>
<strong>State transition table (input X):</strong><br>
<pre>
State  X=0    X=1    Output(Moore)
S0     S0     S1     0
S1     S2     S1     0
S2     S0     S3     0
S3     S2     S4     0
S4     S2     S1     1  ← detection
</pre>
<strong>Why S4→S2 on X=0:</strong> After detecting 1011, if next bit is 0, we have "10" which could start a new pattern → go to S2.<br>
Why S4→S1 on X=1: After 1011, if next bit is 1, we have "1" → go to S1 (overlapping).<br><br>
<strong>Verilog sketch:</strong><br>
<pre>
always @(posedge clk)
  case (state)
    S0: state <= x ? S1 : S0;
    S1: state <= x ? S1 : S2;
    S2: state <= x ? S3 : S0;
    S3: state <= x ? S4 : S2;
    S4: state <= x ? S1 : S2;
  endcase
assign detected = (state == S4);
</pre>
<strong>Interview tip:</strong> Always draw the state diagram first. Label every arc with input/output. Count states — if you have more states than needed, check for equivalent states. If you have fewer, check for missing arcs (incomplete specification).`},

{c:"fsm",d:"med",q:"What are one-hot, binary, and Gray state encodings? When is each preferred?",
a:`<strong>Binary encoding:</strong> States encoded as binary numbers. N states require ⌈log2(N)⌉ flip-flops.<br>
- Minimum FFs<br>
- Moderate decode logic (next-state uses all state bits)<br>
- Preferred for ASIC when area matters<br><br>
<strong>One-hot encoding:</strong> One FF per state. Exactly one FF is HIGH at any time.<br>
- N states require N flip-flops<br>
- Very simple decode logic (check only one FF per transition)<br>
- Fast — next-state and output logic is minimal (sparse transitions)<br>
- Preferred for FPGA (abundant FFs, routing is the bottleneck)<br>
- Preferred for high-speed ASIC state machines (pipeline-friendly)<br><br>
<strong>Gray encoding:</strong> Adjacent states differ by 1 bit.<br>
- Reduces glitch power (only 1 FF toggles per transition)<br>
- Useful when state transitions create output glitches (e.g., decoded state drives a bus)<br>
- Only valid for linear or circular state sequences (not arbitrary FSMs)<br><br>
<strong>Comparison table:</strong><br>
<pre>
Encoding   FFs needed   Logic complexity   Speed   Power
Binary     log2(N)      High               Medium  Medium
One-hot    N            Low                High    Higher (more FFs toggle)
Gray       log2(N)      Medium             Medium  Lower
</pre>
<strong>RTL practice:</strong> Use <code>localparam</code> with defined state names — let synthesis tool choose encoding via synthesis constraints (<code>syn_encoding</code> attribute).`},

{c:"fsm",d:"hard",q:"How do you handle FSM reset and unreachable states? What happens if an FSM enters an illegal state?",
a:`<strong>Unreachable states:</strong> States that cannot be entered from any reachable state via any input sequence. They exist in the state space but are never visited in normal operation.<br><br>
<strong>Why dangerous:</strong><br>
If the FSM enters an unreachable state (due to power-up glitch, SEU — single-event upset from radiation, or async reset issue), it may:<br>
1. Lock up — no defined transitions out<br>
2. Produce incorrect outputs<br>
3. Cycle through other illegal states indefinitely<br><br>
<strong>How to handle:</strong><br>
1. <strong>Default case in RTL:</strong><br>
<pre>
always @(posedge clk)
  case (state)
    S0: ...
    S1: ...
    // Handle illegal states:
    default: state <= S_RESET;
  endcase
</pre>
Always include a default case that returns to a safe state.<br><br>
2. <strong>State encoding choice:</strong> One-hot is more robust — only one state is supposed to be active. If multiple FFs accidentally set, default case catches it. Binary encoding with default → FSM self-recovers.<br><br>
3. <strong>Formal verification:</strong> Use model checking to prove all reachable states are valid (no illegal state is reachable from reset). Tools: JasperGold, VC Formal.<br><br>
4. <strong>Synthesis tool directive:</strong> <code>syn_state_machine -safe</code> tells the tool to add logic for safe recovery from illegal states.<br><br>
<strong>Interview answer summary:</strong> Always code an explicit reset state, always use default case in the state machine, and verify with formal tools for safety-critical designs.`},

{c:"fsm",d:"hard",q:"Design a traffic light controller FSM for a 4-way intersection with pedestrian crossing support.",
a:`<strong>Signals:</strong> NS_light (NS road), EW_light (EW road), PED_light (pedestrian).<br>
<strong>Inputs:</strong> ped_btn (pedestrian button pressed), timer (timing pulse from counter)<br><br>
<strong>States and transitions:</strong><br>
<pre>
State         NS    EW    PED   Duration
NS_GREEN      GRN   RED   DON'T  T_NS (e.g., 30s)
NS_YELLOW     YLW   RED   DON'T  T_Y  (e.g., 5s)
EW_GREEN      RED   GRN   DON'T  T_EW (e.g., 30s)
EW_YELLOW     RED   YLW   DON'T  T_Y  (5s)
PED_CROSS     RED   RED   WALK   T_P  (e.g., 20s)
ALL_RED       RED   RED   DON'T  T_AR (3s — safety gap)
</pre>
<strong>State diagram flow:</strong><br>
NS_GREEN → NS_YELLOW → [if ped_btn: PED_CROSS → ALL_RED → EW_GREEN]<br>
                     → [else: ALL_RED → EW_GREEN]<br>
EW_GREEN → EW_YELLOW → [if ped_btn: PED_CROSS → ALL_RED → NS_GREEN]<br>
                     → [else: ALL_RED → NS_GREEN]<br><br>
<strong>Timer implementation:</strong> A separate counter counts clock cycles and asserts timer when duration expired. FSM transitions only on timer assertion.<br><br>
<strong>Safety properties to verify (formal):</strong><br>
1. NS_light=GREEN AND EW_light=GREEN is never simultaneously true<br>
2. PED_CROSS only entered when both road lights are RED<br>
3. No state is unreachable from RESET<br>
4. FSM eventually serves every state (no livelock)`},

{c:"fsm",d:"med",q:"What is state minimization? Explain the implication table (Mileage method) briefly.",
a:`<strong>State minimization</strong> reduces the number of states in an FSM to a minimum equivalent form, saving flip-flops and logic.<br><br>
<strong>Two states are equivalent if:</strong><br>
1. They produce the same output for all inputs (Moore) or for all input/state combinations (Mealy)<br>
2. For every input, they transition to equivalent (or the same) next states<br><br>
<strong>Implication Table Method:</strong><br>
1. Create a triangular table with all pairs of states as cells<br>
2. Cross out pairs that produce different outputs (directly incompatible)<br>
3. For remaining pairs, fill in implied pairs (the next states that must also be equivalent)<br>
4. Iteratively cross out pairs whose implied pairs were already crossed out<br>
5. Remaining uncrossed pairs = equivalent state pairs → merge them<br><br>
<strong>Example outcome:</strong> If S2 and S5 are equivalent, replace all occurrences of S5 with S2, reducing state count by 1.<br><br>
<strong>Importance for interviews:</strong><br>
- Shows understanding of FSM optimization (beyond just drawing the diagram)<br>
- Synthesis tools do this automatically (state minimization pass in DC/Genus)<br>
- For manual design, minimized states → fewer FFs → lower area/power<br><br>
<strong>Caveat:</strong> State minimization assumes deterministic FSM. For non-deterministic or incompletely specified FSMs, use compatible state method instead.`},

{c:"fsm",d:"med",q:"What is a Mealy output glitch and how do you register FSM outputs to prevent it?",
a:`<strong>Mealy output glitch cause:</strong><br>
In a Mealy FSM, output is a combinational function of state AND input. If the input glitches (transitions multiple times before settling), the output will also glitch — even if the state doesn't change.<br><br>
<strong>Example:</strong><br>
Input changes: 0 → glitch 1 → settle 0. State stays S2. Output toggles twice unnecessarily. If this output drives a FF in another block, it may capture a wrong value.<br><br>
<strong>Solution — register the output:</strong><br>
<pre>
// Unregistered (glitchy):
assign out = (state == S2) && input_x;

// Registered (glitch-free):
always @(posedge clk)
  out_reg <= (state == S2) && input_x;
</pre>
This adds 1 cycle latency but eliminates glitches. Effectively converts Mealy to Moore behavior.<br><br>
<strong>Pipeline-pipelined FSM style:</strong><br>
Separate three always blocks:<br>
1. State register: sequential, updates state on clock edge<br>
2. Next-state logic: combinational, computes next_state<br>
3. Output register: sequential, registers output<br><br>
This is the preferred RTL style for all production FSMs — clean, glitch-free, and STA-friendly.`},

{c:"fsm",d:"hard",q:"How do you design a packet parser FSM for a simple protocol frame: [SOF(1B) | LEN(1B) | DATA(LEN bytes) | CRC(2B)]?",
a:`<strong>States:</strong><br>
<pre>
IDLE      → waiting for SOF (0xAA)
GOT_SOF   → next byte is LEN
GOT_LEN   → DATA[0..LEN-1]
DATA_RX   → receiving data bytes, counter = LEN
CRC1      → first CRC byte
CRC2      → second CRC byte
VALIDATE  → check CRC, assert valid/invalid
</pre>
<strong>Datapath alongside FSM:</strong><br>
- Byte counter: loaded with LEN in GOT_LEN state, decremented each DATA_RX clock<br>
- CRC accumulator: XOR / CRC-16 running over DATA bytes; compare with received CRC1:CRC2<br>
- Data buffer: shift register or FIFO accumulating data bytes<br><br>
<strong>State transition logic:</strong><br>
<pre>
IDLE    : rx_valid && rx_data==SOF_BYTE → GOT_SOF
GOT_SOF : rx_valid → load counter=rx_data → GOT_LEN
GOT_LEN : rx_valid → DATA_RX (counter = LEN)
DATA_RX : rx_valid && counter>1 → DATA_RX (cnt--)
          rx_valid && counter==1 → CRC1
CRC1    : rx_valid → latch crc_byte1 → CRC2
CRC2    : rx_valid → latch crc_byte2 → VALIDATE
VALIDATE: computed_crc==rx_crc → valid_pulse ; → IDLE
          else → error_pulse ; → IDLE
</pre>
<strong>Key interview points:</strong><br>
1. Handle flow control: what if rx_valid is de-asserted mid-frame? Add a timeout counter → ERROR state.<br>
2. Handle frame abort: what if SOF appears mid-frame? Reset to GOT_SOF.<br>
3. Pipelining: VALIDATE can run while next SOF is arriving.`},

{c:"fsm",d:"easy",q:"What is a safe FSM and a one-hot encoded FSM? How do you code them in Verilog?",
a:`<strong>One-hot FSM in Verilog:</strong><br>
<pre>
localparam [3:0]
  S_IDLE  = 4'b0001,
  S_FETCH = 4'b0010,
  S_EXEC  = 4'b0100,
  S_WB    = 4'b1000;

reg [3:0] state, next;

always @(posedge clk or posedge rst)
  if (rst) state <= S_IDLE;
  else     state <= next;

always @(*) begin
  next = S_IDLE;  // default prevents latches
  case (1'b1)  // one-hot: check which bit is set
    state[0]: next = start ? S_FETCH : S_IDLE;
    state[1]: next = S_EXEC;
    state[2]: next = S_WB;
    state[3]: next = S_IDLE;
    default:  next = S_IDLE;  // ← safe recovery
  endcase
end
</pre>
<strong>Safe FSM:</strong> An FSM that includes explicit handling for all possible state register values, including illegal ones (unused states), ensuring the FSM never gets stuck.<br><br>
<strong>Key coding rules for production FSMs:</strong><br>
1. Always initialize to a known state on reset<br>
2. Always include <code>default</code> in case statement → prevents latches AND handles illegal states<br>
3. Assign a default value to <code>next</code> and all outputs at the top of the combinational block<br>
4. Use localparam for state names — never magic numbers<br>
5. Use <code>/* synthesis syn_encoding = "one-hot" */</code> attribute if you want to force encoding`},

{c:"fsm",d:"med",q:"Design an FSM-based UART receiver that detects start bit, samples 8 data bits, and verifies stop bit.",
a:`<strong>UART frame:</strong> 1 start bit (LOW), 8 data bits (LSB first), 1 stop bit (HIGH).<br>
Clock requirement: oversample at 16× baud rate for robust bit centering.<br><br>
<strong>States:</strong><br>
<pre>
IDLE     → waiting for start bit (rx=1 normally)
START    → detected rx=0; wait half-bit to center sample
DATA     → sample 8 bits at full-bit intervals
STOP     → verify stop bit (rx must be 1)
DONE     → assert data_valid for one cycle
ERROR    → framing error (stop bit was 0)
</pre>
<strong>Counters used:</strong><br>
- <code>baud_cnt[3:0]</code>: 0..15 for 16× oversampling. Transition states every 16 counts. Move to center of START bit at count=8.<br>
- <code>bit_cnt[2:0]</code>: 0..7 counts received data bits<br><br>
<strong>Transition logic:</strong><br>
<pre>
IDLE  : rx==0 → clear baud_cnt → START
START : baud_cnt==8 → sample check: rx==0 → DATA
                                     rx==1 → IDLE (noise)
DATA  : baud_cnt==15 → shift in rx → bit_cnt++
        bit_cnt==7 and baud_cnt==15 → STOP
STOP  : baud_cnt==15 → rx==1 → DONE ; rx==0 → ERROR
DONE  : → IDLE (assert data_valid, output shift_reg)
</pre>
<strong>Metastability note:</strong> The rx pin is asynchronous → pass through 2-FF synchronizer before the FSM. This adds 2 cycles of latency (irrelevant at 16× oversampling).`},

/* ══════════════════════════════════════════
   DEBUG & VERIFICATION  (10 questions)
══════════════════════════════════════════ */
{c:"debug",d:"med",q:"What is assertion-based verification (ABV)? Give examples of SystemVerilog assertions for a FIFO.",
a:`<strong>Assertion-Based Verification (ABV):</strong> Formal statements embedded in RTL that specify correct behavior. When violated during simulation or formal verification, they fire immediately pinpointing the bug.<br><br>
<strong>Two types of SVA assertions:</strong><br>
<code>assert property</code>: checked during simulation — fires error if false<br>
<code>assume property</code>: used in formal verification to constrain inputs<br><br>
<strong>FIFO assertions examples:</strong><br>
<pre>
// No overflow: push when full is illegal
assert property (@(posedge clk) 
  !(push && full)) else $error("FIFO overflow!");

// No underflow: pop when empty is illegal  
assert property (@(posedge clk) 
  !(pop && empty)) else $error("FIFO underflow!");

// Full flag correct: count==DEPTH implies full
assert property (@(posedge clk) 
  (count == DEPTH) |-> full);

// Data integrity: what goes in must come out (in order)
// (requires scoreboard/checker for complex version)

// Pointer wrap-around: write ptr cycles correctly
assert property (@(posedge clk) 
  (wr_ptr == DEPTH-1 && push) |=> (wr_ptr == 0));
</pre>
<strong>Concurrent vs immediate assertions:</strong><br>
- Immediate: <code>assert(expr)</code> — like an if-statement, checked at that simulation instant<br>
- Concurrent: <code>assert property</code> — checked at clock edges, can span multiple cycles (sequence)<br><br>
<strong>Benefits:</strong> Assertions catch bugs at the source, not symptoms. In a 10M-gate design, a bug caught at the assertion is 10× faster to debug than one caught at system-level.`},

{c:"debug",d:"hard",q:"You have a simulation where a flip-flop output is 'X' (unknown). How do you systematically debug the source of the X?",
a:`<strong>X-propagation is one of the most common and annoying RTL bugs.</strong><br><br>
<strong>Common sources of X:</strong><br>
1. Uninitialized register (no reset assigned)<br>
2. Undriven net (floating wire in netlist)<br>
3. Simulation library cell has X output for certain input combo (e.g., latch with conflicting S=R=1)<br>
4. Out-of-range memory access<br>
5. Division by zero<br>
6. Metastability in simulation (some CDC synchronizer models)<br><br>
<strong>Debug steps:</strong><br>
<strong>Step 1: Trace the X backward in the waveform</strong><br>
Find the first clock cycle where the X appears. Use simulator's "drivers" command to find the driver of that net.<br><br>
<strong>Step 2: Check for missing reset</strong><br>
If the X appears at time 0 and propagates on first clock edge: the FF has no reset. Add an initial block for simulation or add async reset.<br><br>
<strong>Step 3: Check combinational sources</strong><br>
Use <code>$display</code> tracing or add waveform probes on all inputs to the offending FF's D input. Which input is X?<br><br>
<strong>Step 4: Check for latch inference</strong><br>
Synthesized latch (unintended): if a variable is not assigned in all branches of combinational always block → X during undriven branch.<br><br>
<strong>Step 5: Use X-propagation tools</strong><br>
Synopsys VCS Xprop mode or Questa Xprop improves X-semantics. Tools like Mentor Questa X-check can automatically trace X sources.<br><br>
<strong>Step 6: Check formal X-analysis</strong><br>
JasperGold X-propagation analysis finds all possible X sources statically without simulation.`},

{c:"debug",d:"med",q:"What is functional coverage and code coverage in RTL verification? How do you use them together?",
a:`<strong>Code Coverage</strong> measures which RTL constructs were executed during simulation:<br>
- <em>Line coverage:</em> which RTL lines were executed<br>
- <em>Statement coverage:</em> which statements ran<br>
- <em>Branch coverage:</em> both if/else branches taken<br>
- <em>Condition coverage:</em> each Boolean sub-expression evaluated T and F<br>
- <em>Toggle coverage:</em> each signal transitioned 0→1 and 1→0<br>
- <em>FSM coverage:</em> all states visited, all transitions taken<br><br>
<strong>Functional Coverage</strong> measures whether design-intent scenarios were exercised:<br>
- Written by the verification engineer based on the specification<br>
- Uses covergroups, coverpoints, cross-coverage in SystemVerilog<br><br>
<strong>Example:</strong><br>
<pre>
covergroup cg_fifo @(posedge clk);
  cp_fill: coverpoint fifo_count {
    bins empty = {0};
    bins half   = {[1:DEPTH/2-1]};
    bins full   = {DEPTH};
  }
  cp_ops: coverpoint {push,pop} {
    bins push_only = {2'b10};
    bins pop_only  = {2'b01};
    bins both      = {2'b11};  // simultaneous push+pop
  }
endgroup
</pre>
<strong>Using them together:</strong><br>
High code coverage + low functional coverage = tested code but missing scenarios<br>
High functional coverage + low code coverage = dead code might indicate spec gaps<br>
Target: 100% code + 100% functional coverage for tape-out sign-off.`},

{c:"debug",d:"hard",q:"What is formal verification? When should you use it instead of (or in addition to) simulation?",
a:`<strong>Formal verification</strong> mathematically proves properties about a design for ALL possible inputs and states, not just the ones simulation vectors happen to exercise.<br><br>
<strong>Key techniques:</strong><br>
<em>Model Checking:</em> Exhaustively explores all reachable states of the design and verifies that properties hold in all of them. Tools: JasperGold (Cadence), VC Formal (Synopsys).<br>
<em>Equivalence Checking:</em> Proves that two netlists (e.g., RTL vs gate-level) are functionally identical. Used in synthesis and ECO sign-off.<br>
<em>Property Checking:</em> Verifies SVA properties exhaustively.<br><br>
<strong>When to use formal instead of simulation:</strong><br>
1. <strong>Deep corner cases:</strong> FSM illegal states, CDC handshake correctness — simulation may never hit these<br>
2. <strong>Small, complex blocks:</strong> Arbiters, FIFOs, CDC synchronizers — small state space, critical correctness<br>
3. <strong>Protocol correctness:</strong> AXI/CHI ordering properties — too many transaction interleavings to simulate exhaustively<br>
4. <strong>X-propagation analysis:</strong> Find all possible X sources statically<br>
5. <strong>Security properties:</strong> "Buffer A is never accessible from domain B" — simulation can't exhaustively prove it<br><br>
<strong>Limitations of formal:</strong><br>
State space explosion: for large designs, formal may not converge (can't prove, but also can't disprove). Solution: divide into smaller bounded proofs or use assume/guarantee decomposition.<br><br>
<strong>IBM / Qualcomm practice:</strong> Formal used for CDC checks (Jasper CDC), connectivity checks (Synopsys VC LP), and FSM property checking. Simulation used for performance, integration, and scenario coverage.`},

{c:"debug",d:"med",q:"What is a race condition in RTL? How does blocking vs non-blocking assignment in Verilog cause it?",
a:`<strong>Race condition:</strong> When two or more concurrent processes read/write the same variable in an undefined order, and the result depends on which executes first — leading to non-deterministic simulation behavior.<br><br>
<strong>Blocking assignment (<code>=</code>):</strong><br>
Executes sequentially within an always block. RHS evaluated and LHS updated immediately before next statement.<br><br>
<strong>Non-blocking assignment (<code>&lt;=</code>):</strong><br>
RHS evaluated immediately, but LHS updated at the END of the time step (after all blocking assignments and process activations in that time step).<br><br>
<strong>Classic race condition with blocking:</strong><br>
<pre>
// Two always blocks, both triggered by posedge clk
always @(posedge clk) a = b;  // blocking
always @(posedge clk) b = a;  // blocking
// Simulator may execute either block first
// Result depends on evaluation order: NOT deterministic
</pre>
<strong>Correct with non-blocking:</strong><br>
<pre>
always @(posedge clk) a <= b;  // captures old b
always @(posedge clk) b <= a;  // captures old a
// Both RHS evaluated before LHS updated: correct swap!
</pre>
<strong>Golden rules for synthesizable RTL:</strong><br>
1. Sequential logic: ALWAYS use <code>&lt;=</code> (non-blocking)<br>
2. Combinational logic: ALWAYS use <code>=</code> (blocking)<br>
3. NEVER mix <code>=</code> and <code>&lt;=</code> in the same always block<br>
4. NEVER use blocking assignments in a clocked always block<br><br>
Violating these rules = race conditions in simulation + incorrect synthesis results.`},

{c:"debug",d:"hard",q:"What is an async FIFO? How do you design one correctly to avoid metastability and pointer comparison bugs?",
a:`An <strong>async FIFO</strong> decouples two clock domains using a shared buffer. The write side runs in the write clock domain (wclk); the read side runs in the read clock domain (rclk).<br><br>
<strong>Core challenge:</strong> Write pointer (wptr) and read pointer (rptr) live in different clock domains. Comparing them for full/empty detection requires crossing clock domains safely.<br><br>
<strong>Correct design steps:</strong><br><br>
<strong>1. Use Gray-coded pointers:</strong><br>
<pre>
wptr_gray = wptr ^ (wptr >> 1);  // binary to Gray
rptr_gray = rptr ^ (rptr >> 1);
</pre>
Gray code changes only 1 bit per count step → at most 1 bit can be metastable during synchronization.<br><br>
<strong>2. Synchronize Gray pointer to opposite domain:</strong><br>
<pre>
// Sync wptr_gray into rclk domain (2-FF sync):
always @(posedge rclk) {wptr_gray_r1, wptr_gray_rclk} <= 
                       {wptr_gray, wptr_gray_r1};
</pre>
<strong>3. Full and empty detection:</strong><br>
<pre>
// Empty: read ptr == synchronized write ptr
assign empty = (rptr_gray == wptr_gray_rclk);
// Full: MSBs differ, remaining bits equal (with N+1 bit ptrs)
assign full = (wptr_gray[N:N-1] == ~rptr_gray_wclk[N:N-1]) 
           && (wptr_gray[N-2:0] == rptr_gray_wclk[N-2:0]);
</pre>
Use N+1 bit pointers to distinguish full from empty.<br><br>
<strong>4. SRAM port timing:</strong><br>
Write side: write enable = push && !full, address = wptr[N-1:0]<br>
Read side: read enable = pop && !empty, address = rptr[N-1:0]<br><br>
<strong>Common bugs:</strong> Using binary pointers directly across domains (wrong), forgetting the N+1 bit pointer trick (full=empty confusion), synchronizing data bus directly (wrong — use handshake or Gray code only).`},

{c:"debug",d:"med",q:"A design passes simulation but fails on silicon. What are the common reasons and debug approaches?",
a:`This is one of the most important practical interview questions. Common root causes:<br><br>
<strong>1. Timing violations not caught in STA</strong><br>
Unconstrained paths, incorrect timing exceptions (false path/MCP set incorrectly), process-voltage-temperature (PVT) corners not covered.<br>
Debug: Re-run STA with tightened margins. Check all false path and MCP constraints. Run timing at worst-case PVT corner.<br><br>
<strong>2. CDC issues not caught in CDC analysis</strong><br>
Missing synchronizer on a control signal, multi-bit data bus crossing without handshake.<br>
Debug: Run Jasper CDC or Questa CDC on the silicon-failing scenario. Check CDC waivers for correctness.<br><br>
<strong>3. X-optimism in simulation</strong><br>
Simulation treats X as "don't care" in some expressions (e.g., <code>X & 0 = 0</code> in sim, but CMOS may drive a 1). Silicon has no X — the wire is either 0 or 1.<br>
Debug: Enable Xprop pessimism mode in simulator. Re-simulate with VCS Xprop or Questa Xprop enabled.<br><br>
<strong>4. Analog/mixed-signal interface issues</strong><br>
I/O timing between chip and board exceeds setup/hold. Power supply noise causing VDD droops on the chip.<br>
Debug: Oscilloscope measurements at the chip pins. Power rail monitoring.<br><br>
<strong>5. Power domain issues</strong><br>
Incorrect power state sequence, missing isolation cells, retention register not restored correctly after power-up.<br>
Debug: Check UPF/CPF power intent vs implementation. Re-run power-aware simulation.<br><br>
<strong>6. Manufacturing defect</strong><br>
If only some parts fail: process variation, ESD damage, metal shorts/opens.<br>
Debug: ATPG test coverage → defective nets show as stuck-at faults.`},

{c:"debug",d:"easy",q:"What is the difference between simulation and emulation in IC verification?",
a:`<strong>Simulation (software-based):</strong><br>
Runs the RTL model on a computer CPU/GPU. Cycle-accurate but slow.<br>
- Speed: typically 10 KHz – 1 MHz simulated cycles/second<br>
- Flexibility: full visibility into all signals, easy debug<br>
- Cost: cheap (EDA tool license only)<br>
- Use: unit-level verification, directed tests, assertion checking, coverage collection<br><br>
<strong>Emulation (hardware-based — e.g., Palladium, Veloce, ZeBu):</strong><br>
Compiles RTL and maps it to a large array of FPGAs or custom logic chips in hardware.<br>
- Speed: 1 MHz – 50 MHz real clock rates (1000× faster than simulation)<br>
- Visibility: limited (must add probes; can't see all signals simultaneously)<br>
- Cost: very expensive ($1M–$10M systems; $50K+/month cloud rental)<br>
- Use: software/firmware bring-up, system-level integration, OS boot verification, performance modeling<br><br>
<strong>FPGA Prototyping:</strong><br>
Maps RTL to actual FPGA chips. Even faster (full FPGA speed = tens to hundreds MHz). Used for pre-silicon software development and customer demos. Less flexible than emulation (requires significant RTL changes for FPGA targeting).<br><br>
<strong>When each is used in IBM Power12 flow:</strong><br>
- Unit/block level: simulation (VCS/Questa)<br>
- Chip/system level: Palladium emulation for OS boot, RAS testing<br>
- Firmware development: FPGA prototype`},

{c:"debug",d:"hard",q:"What is power-aware verification? What issues does it check for in a multi-power-domain SoC?",
a:`<strong>Power-aware verification (PAV)</strong> ensures that power management logic (power gating, voltage scaling, retention) is correctly implemented and that data integrity is maintained across power state transitions.<br><br>
<strong>UPF/CPF power intent:</strong><br>
Designers write a UPF (Unified Power Format) file specifying:<br>
- Power domains and their supply voltages<br>
- Power states (ON, OFF, RETENTION)<br>
- Isolation cells (prevent floating signals from powered-off domain driving powered-on domain)<br>
- Level shifters (between domains at different voltages)<br>
- Retention registers (save state before power-off, restore after power-on)<br><br>
<strong>Bugs caught by PAV:</strong><br>
1. <strong>Missing isolation:</strong> Signal from OFF domain drives ON domain → floating input, X-propagation on silicon<br>
2. <strong>Wrong isolation polarity:</strong> Isolation clamps to 1 but downstream logic expects 0 idle value → incorrect behavior<br>
3. <strong>Retention restore timing:</strong> Retention register data restored before power rail stabilizes → corrupt restore<br>
4. <strong>Level shifter missing:</strong> 0.6V domain signal drives 1.2V domain gate directly → wrong logic level interpretation<br>
5. <strong>Power sequencing violation:</strong> Domain B powered on before Domain A (which Domain B depends on) → startup failure<br><br>
<strong>Tools:</strong> Synopsys VCS PAV mode, Mentor Questa Power Aware, Cadence Incisive Power Aware.<br><br>
<strong>In your IBM context:</strong> Power12/Neela likely has 10+ power domains (CPU cores, L2/L3 caches, I/O, PHY, etc.). PAV is mandatory before tapeout.`},

/* ══════════════════════════════════════════
   SOC / LOW POWER  (10 questions)
══════════════════════════════════════════ */
{c:"soc",d:"easy",q:"What are the main sources of power consumption in a digital CMOS chip? How is each minimized?",
a:`CMOS power has three main components:<br><br>
<strong>1. Dynamic (switching) power — dominant (~60-70%):</strong><br>
<code>P_dyn = α·C·V²·f</code><br>
α = switching activity, C = capacitance, V = supply voltage, f = frequency<br>
Minimize by: reducing activity (clock gating, operand isolation), reducing voltage (DVFS), reducing frequency (DVFS), reducing capacitance (smaller transistors, shorter wires)<br><br>
<strong>2. Short-circuit power (~10%):</strong><br>
Both P and N transistors briefly ON during input transition → direct current path VDD→GND.<br>
Minimize by: controlling input slew rate (not too slow), proper cell sizing<br><br>
<strong>3. Static (leakage) power — increasingly dominant at smaller nodes:</strong><br>
<code>P_static = I_leak × V</code><br>
Sub-threshold leakage: transistors leak even when "off"<br>
Gate oxide leakage: tunneling through thin oxide<br>
Minimize by: high-Vt cells on non-critical paths (higher Vt → lower leakage, higher delay), power gating (cut VDD to idle blocks), back-biasing (increase Vt dynamically), multi-Vt design strategy<br><br>
<strong>Multi-Vt strategy (used in IBM Power12):</strong><br>
- LVT (Low Vt): used on critical timing paths — fast but leaky<br>
- SVT (Standard Vt): balanced tradeoff<br>
- HVT (High Vt): used on non-critical paths — slow but low leakage<br>
Mix these to meet timing with minimum leakage.`},

{c:"soc",d:"med",q:"What is DVFS (Dynamic Voltage and Frequency Scaling) and how does it work in a modern SoC?",
a:`<strong>DVFS</strong> dynamically adjusts operating voltage and frequency based on workload, minimizing power while meeting performance targets.<br><br>
<strong>Principle:</strong><br>
Since dynamic power ∝ V²·f and maximum frequency ∝ (VDD - Vt), reducing VDD allows reducing f proportionally. Power scales as V² → a 20% voltage reduction → ~36% power reduction.<br><br>
<strong>Operating points (OPP):</strong><br>
SoC has pre-characterized voltage-frequency pairs (OPPs):<br>
<pre>
OPP   VDD    Freq
High  1.0V   2.4GHz   (peak performance)
Mid   0.85V  1.8GHz   (balanced)
Low   0.7V   1.2GHz   (battery saver)
Deep  0.6V   600MHz   (standby/light load)
</pre>
<strong>Implementation:</strong><br>
1. Power Management IC (PMIC) adjusts VDD via I²C/SPI command<br>
2. On-chip DVFS controller monitors workload (CPU utilization, thermal sensors, battery state)<br>
3. For a frequency change: first lower frequency (to avoid violating setup at lower voltage), then lower voltage<br>
For a frequency increase: first raise voltage, then raise frequency<br><br>
<strong>STA interaction:</strong> Each OPP must have its own timing sign-off. PrimeTime runs timing at each VDD/frequency corner.<br><br>
<strong>Thermal management:</strong> DVFS is also triggered by thermal events — CPU throttles frequency when junction temperature exceeds threshold (thermal throttling).`},

{c:"soc",d:"med",q:"What is power gating? What are the key design considerations when implementing it?",
a:`<strong>Power gating</strong> cuts the power supply (VDD or GND) to an entire block when it's idle, reducing both dynamic and static (leakage) power to near zero for that block.<br><br>
<strong>Components needed:</strong><br>
1. <strong>Header switch (PMOS):</strong> Gates VDD supply. PMOS in series with VDD.<br>
2. <strong>Footer switch (NMOS):</strong> Gates VSS (GND). NMOS in series with GND. Faster switch-on but higher IR drop concerns.<br>
3. <strong>Isolation cells:</strong> Clamp outputs of powered-off domain to a safe value (0 or 1) to prevent floating inputs driving other logic.<br>
4. <strong>Retention registers:</strong> Small, always-on FFs (using a secondary low-leakage supply) that save critical state before power-off and restore it on power-on.<br>
5. <strong>Power switch control logic:</strong> Always-on block that manages power sequence and wake-up.<br><br>
<strong>Key design considerations:</strong><br>
1. <strong>Inrush current:</strong> When power gate turns on, the decoupling capacitors in the block draw a large current surge. Use distributed smaller switch cells with staggered enable to limit inrush.<br>
2. <strong>IR drop on virtual rail:</strong> The power switch has non-zero resistance → voltage drop under load. Analyze virtual VDD (VVDD) IR drop during active mode.<br>
3. <strong>Wake-up latency:</strong> Turning on the power switch, restoring retention registers, and reinitializing logic takes cycles. Must be budgeted against system response requirements.<br>
4. <strong>Power sequencing:</strong> Always-on control logic must ensure correct power-on/off sequence per UPF specification.`},

{c:"soc",d:"hard",q:"What are isolation cells and level shifters in a multi-voltage SoC? Where exactly must they be placed?",
a:`<strong>Isolation Cells:</strong><br>
When domain A is powered OFF and drives a signal into domain B (powered ON), the signal from domain A is floating (undefined). Without isolation, domain B receives a floating input → potential latch-up, excessive current, X-propagation.<br>
Isolation cells are placed on every signal crossing from a power-gated domain (A) into an always-on domain (B). They clamp the output to a known safe value when the enable (domain A power-up signal) is de-asserted.<br>
<pre>
Isolation types:
  AND-type:  out = in AND iso_enable  → clamp to 0 when off
  OR-type:   out = in OR  iso_enable  → clamp to 1 when off
  Buffer:    Registered (saves area with Retention+Iso combined)
</pre>
<strong>Placement rule:</strong> Must be in the ALWAYS-ON domain, NOT in the power-gated domain (they'd lose power too).<br><br>
<strong>Level Shifters:</strong><br>
When domain A operates at voltage V1 and domain B at voltage V2, a logic-1 in domain A = V1. If V1 < V2, the receiving gate in domain B may not recognize V1 as a valid logic-1.<br>
Level shifters translate voltage levels at domain crossings.<br>
<pre>
Types:
  Low-to-High: V1 input → V2 output (step-up)
  High-to-Low: V2 input → V1 output (step-down, simpler — standard FET threshold works)
  Bidirectional: For I/O pins
</pre>
<strong>Placement rule:</strong> Level shifter powered by the HIGHER voltage domain. For low-to-high: typically in the receiving (high-voltage) domain.<br><br>
<strong>Common mistakes:</strong> Forgetting level shifters on control signals (not just data), placing isolation cells in the wrong domain, missing level shifters on feedback paths.`},

{c:"soc",d:"hard",q:"What is a memory BIST (Built-In Self-Test)? How is it implemented for an SRAM in a digital SoC?",
a:`<strong>Memory BIST (MBIST)</strong> is an on-chip circuit that can test embedded SRAMs autonomously, without external test vectors, using standardized march algorithms.<br><br>
<strong>Why needed:</strong><br>
- External tester cannot directly access internal SRAM cells<br>
- SRAM faults (stuck-at, transition, coupling, pattern-sensitive) require specific test patterns<br>
- Production test time reduction (BIST runs at-speed on chip)<br><br>
<strong>March algorithm example (March C-):</strong><br>
<pre>
Step 1: ↑(w0)     — write 0 to all cells, ascending
Step 2: ↑(r0,w1)  — read 0, write 1, ascending
Step 3: ↑(r1,w0)  — read 1, write 0, ascending
Step 4: ↓(r0,w1)  — read 0, write 1, descending
Step 5: ↓(r1,w0)  — read 1, write 0, descending
Step 6: ↑(r0)     — read 0, ascending
</pre>
Detects: stuck-at-0, stuck-at-1, transition faults, coupling faults.<br><br>
<strong>MBIST controller implementation:</strong><br>
- Address generator: steps through all memory addresses<br>
- Data generator: produces 0, 1, checkerboard, march patterns<br>
- Expected data comparator: compares read data to expected → fail register<br>
- Mode MUX: switches SRAM between functional and BIST access<br>
- Repair logic (for yield): identifies failing bit-line row, applies redundancy row repair (eFuse programming)<br><br>
<strong>In IBM Power12:</strong> All on-chip SRAMs (L1/L2/L3 caches, register files, TLBs) have MBIST. Scan-based repair flow uses MBIST failure data to program eFuses selecting redundant rows.`},

{c:"soc",d:"med",q:"What is an on-chip interconnect? Compare ring bus, crossbar, and mesh network topologies for SoC.",
a:`<strong>On-chip interconnect</strong> connects all IP blocks (CPUs, GPUs, memory controllers, I/O) in an SoC to transfer data and control information.<br><br>
<strong>1. Ring Bus:</strong><br>
All nodes connected in a ring; data travels around the ring.<br>
- Simple to implement<br>
- Low latency for small rings (4–8 nodes)<br>
- Bandwidth bottleneck: every transaction traverses the ring<br>
- Used in: Intel Ring Bus (Sandy Bridge to Skylake), IBM POWER6 L3 ring<br><br>
<strong>2. Crossbar (Full Crossbar):</strong><br>
Every master connected to every slave; N×M switch matrix.<br>
- Non-blocking (any master to any slave simultaneously)<br>
- Maximum bandwidth<br>
- Area grows as O(N×M) — not scalable beyond ~8–16 nodes<br>
- Used in: small SoC bus matrices, GPU register file ports<br><br>
<strong>3. Mesh Network (2D/3D):</strong><br>
Nodes arranged in a grid; packets routed hop-by-hop.<br>
- Scalable to 100+ nodes<br>
- Good bandwidth per unit area<br>
- Higher latency (multi-hop)<br>
- Used in: ARM CMN-600/700 (your Hanuma 1.0!), Intel's CCI, Tilera many-core<br><br>
<strong>Comparison:</strong><br>
<pre>
Topology   Scalability  Latency  Bandwidth  Area
Ring       Poor         Low*     Medium     Low
Crossbar   Poor         Lowest   Highest    O(N²)
Mesh       Excellent    Higher   High       O(N)
</pre>
*Ring latency degrades linearly with ring size`},

{c:"soc",d:"med",q:"What is design-for-testability (DFT)? Name the key DFT techniques used in modern SoC design.",
a:`<strong>DFT</strong> is a set of design techniques that make a chip easier to test after manufacturing, increasing fault coverage and reducing test time/cost.<br><br>
<strong>Key DFT techniques:</strong><br><br>
<strong>1. Scan Insertion:</strong><br>
All FFs connected into scan chains. Enables stuck-at and transition fault testing via ATPG (Automatic Test Pattern Generation).<br><br>
<strong>2. Scan Compression (EDT):</strong><br>
Compresses test data using XOR decompressor/compactor. Reduces test time by 50-200×.<br><br>
<strong>3. MBIST (Memory BIST):</strong><br>
On-chip test engine for all embedded SRAMs. Tests stuck-at, transition, coupling faults in memories.<br><br>
<strong>4. Boundary Scan (JTAG — IEEE 1149.1):</strong><br>
Standard 4-wire interface (TDI, TDO, TCK, TMS) for board-level testing, in-system programming, and debug access. All I/O pins have boundary scan cells.<br><br>
<strong>5. IJTAG (IEEE 1687):</strong><br>
Hierarchical access to embedded instruments (MBIST controllers, ATPG compressors, sensors) via a standardized network.<br><br>
<strong>6. LBIST (Logic BIST):</strong><br>
On-chip pattern generation and response analysis using LFSR (for patterns) and MISR (Multiple Input Signature Register, for compacting responses). Test chip logic without external tester patterns.<br><br>
<strong>7. On-chip debug:</strong><br>
ARM CoreSight, RISC-V Nexus: embedded debug logic for processor state, trace, and breakpoints.<br><br>
<strong>IBM Power12 DFT:</strong> Hierarchical scan, EDT compression, full MBIST with repair, LBIST for at-speed testing, JTAG boundary scan on all external pins.`},

{c:"soc",d:"hard",q:"What is voltage droop and IR drop in a power grid? How do they affect chip timing and how are they mitigated?",
a:`<strong>IR Drop (static):</strong><br>
The resistive voltage drop across the power distribution network (metal grid) under DC current load.<br>
<code>ΔV = I × R_grid</code><br>
A cell at the far end of the power grid sees VDD - ΔV. Lower VDD → slower transistors → longer cell delays → potential timing violations.<br><br>
<strong>Dynamic Droop (transient):</strong><br>
When a large block switches simultaneously (e.g., cache read hit on 1M transistors), it draws a large burst current. The inductance L of package and board causes:<br>
<code>ΔV = L × dI/dt</code><br>
This creates a fast voltage droop — VDD can drop 10-20% for nanoseconds, severely degrading timing.<br><br>
<strong>Impact on timing:</strong><br>
Both IR drop and droop reduce effective VDD → cells slow down → setup time violations. Critical paths that barely meet timing at nominal VDD will fail at VDD - ΔV.<br><br>
<strong>Mitigation strategies:</strong><br>
<em>Power grid design:</em> Wide, multiple-layer power straps (M8/M9/RDL for current-carrying). Mesh topology for low resistance.<br>
<em>Decoupling capacitors:</em> On-chip (explicit decap cells in filler areas) and package-level caps charge up and supply local burst current, reducing dI/dt peak.<br>
<em>Power gating sequencing:</em> Stagger wake-up of large blocks to avoid simultaneous inrush current.<br>
<em>Timing sign-off with IR drop:</em> Run PrimeTime with vectorized IR drop waveforms (from Voltus/Apache) — timing derated per cell based on local VDD.<br>
<em>Adaptive Voltage Scaling (AVS):</em> On-chip monitor measures actual worst-case path timing; PMIC adjusts VDD to minimum needed voltage, compensating for IR drop.`},

{c:"soc",d:"hard",q:"What is an eFuse and OTP memory? How are they used in SoC for trimming and configuration?",
a:`<strong>eFuse (Electrical Fuse):</strong><br>
A one-time programmable (OTP) element made from a thin metal or polysilicon wire. Programming: apply a large current pulse (~20mA) to blow (open-circuit) the fuse. Unprogrammed = 0 (conducting); Programmed = 1 (open).<br>
Irreversible — cannot be un-blown.<br><br>
<strong>OTP (One-Time Programmable) memory:</strong><br>
Larger OTP arrays using antifuse (programming creates a short, not an open) or EEPROM-based cells. Holds hundreds to thousands of bits.<br><br>
<strong>SoC uses of eFuse/OTP:</strong><br>
1. <strong>Chip ID / Unique ID:</strong> Factory programs a unique serial number during test. Used for device authentication and traceability.<br>
2. <strong>SRAM repair:</strong> MBIST identifies failing rows; repair algorithm selects redundant rows; eFuse stores the address mapping. On power-up, eFuse reader reconfigures SRAM to use redundant rows.<br>
3. <strong>Frequency binning:</strong> Post-silicon speed test determines max operating frequency. Result fused into OTP. On boot, BIOS reads fuse to set max turbo frequency.<br>
4. <strong>Security keys / Boot mode:</strong> Root-of-trust keys, secure boot enable bits stored in OTP (tamper-evident).<br>
5. <strong>Analog trimming:</strong> ADC/DAC offset correction values, PLL trim codes, bandgap reference trim.<br>
6. <strong>Feature enable/disable:</strong> Binning a part for a specific market (e.g., disable cores for lower-tier product).<br><br>
<strong>IBM Power context:</strong> eFuses used for L3 cache repair (replacing defective SRAM rows with spares), chip ID, and DVFS frequency limits.`},

{c:"soc",d:"easy",q:"What is the AXI bus protocol? Explain its key channels and compare it to APB and AHB.",
a:`<strong>AXI (Advanced eXtensible Interface)</strong> — Part of ARM AMBA bus family, designed for high-performance SoC interconnects.<br><br>
<strong>5 independent AXI channels:</strong><br>
<code>AW</code>: Write Address — master sends address + burst info<br>
<code>W</code>:  Write Data — master sends data beats<br>
<code>B</code>:  Write Response — slave sends completion status<br>
<code>AR</code>: Read Address — master sends address + burst info<br>
<code>R</code>:  Read Data — slave returns data + status<br><br>
Key features: out-of-order transactions (using AXI ID), burst transfers, separate read/write paths, handshake (valid/ready).<br><br>
<strong>APB (Advanced Peripheral Bus):</strong><br>
Simple, low-power bus for slow peripherals (UART, SPI, GPIO, timers).<br>
- Single address phase + data phase<br>
- No bursts, no out-of-order<br>
- 2-stage pipeline (Setup → Access)<br>
- Used for: register-mapped peripherals<br><br>
<strong>AHB (Advanced High-performance Bus):</strong><br>
Mid-range bus — pipelined but single master bus (no OoO).<br>
- Pipelined address + data<br>
- Burst support<br>
- Single shared bus (arbitration needed for multiple masters)<br>
- Used for: DMA, on-chip ROM, moderate-speed peripherals<br><br>
<strong>Summary:</strong><br>
<pre>
Bus   OoO  Bursts  Multi-master  Target
APB   No   No      No            Slow peripherals
AHB   No   Yes     Arbitrated    Memory, DMA
AXI   Yes  Yes     Full          CPU, GPU, HPC
CHI   Yes  Yes     Full+coherent CPU+cache fabric
</pre>`}

]; // end QS

let got = new Set(), currentCat = 'all', searchStr = '';
const TOTAL = QS.length;

function catMatch(q){
  if(currentCat==='all') return true;
  if(['easy','med','hard'].includes(currentCat)) return q.d===currentCat;
  return q.c===currentCat;
}
function searchMatch(q){
  if(!searchStr) return true;
  return q.q.toLowerCase().includes(searchStr)||q.a.toLowerCase().includes(searchStr);
}

function updateStats(){
  const done=got.size;
  const hardDone=[...got].filter(i=>QS[i].d==='hard').length;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-left').textContent=TOTAL-done;
  document.getElementById('s-hard').textContent=hardDone;
  document.getElementById('s-pct').textContent=Math.round(done/TOTAL*100)+'%';
  document.getElementById('prog-fill').style.width=(done/TOTAL*100)+'%';
  document.getElementById('prog-label').textContent=done+' / '+TOTAL;
}

function render(){
  const list=document.getElementById('q-list');
  const visible=QS.filter(q=>catMatch(q)&&searchMatch(q));
  if(!visible.length){
    list.innerHTML='<div class="no-result">// no questions match — try a different filter</div>';
    return;
  }
  list.innerHTML=visible.map(q=>{
    const idx=QS.indexOf(q);
    const done=got.has(idx);
    return `<div class="q-card${done?' done':''}" id="qc-${idx}">
      <div class="q-header" onclick="toggle(${idx})">
        <span class="q-num">${String(idx+1).padStart(2,'0')}.</span>
        <div class="q-meta">
          <div class="q-tags">
            <span class="tag tag-${q.c}">${{combo:'combinational',seq:'sequential',timing:'timing',fsm:'fsm',debug:'debug',soc:'soc/low-power'}[q.c]}</span>
            <span class="tag tag-${q.d}">${q.d}</span>
            ${done?'<span class="tag tag-easy">✓ done</span>':''}
          </div>
          <div class="q-text">${q.q}</div>
        </div>
        <svg class="q-chev${document.getElementById('ans-'+idx)?.classList.contains('open')?' open':''}" id="chev-${idx}" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="ans-wrap" id="ans-${idx}">
        <div class="ans-label">// ANSWER</div>
        <div class="ans-box">${q.a}</div>
        <div class="chk-row">
          <button class="chk-btn${done?' got':''}" onclick="mark(${idx},true)">✓ Got it</button>
          <button class="chk-btn" onclick="mark(${idx},false)">✕ Need review</button>
        </div>
      </div>
    </div>`;
  }).join('');
  updateStats();
}

function toggle(idx){
  const a=document.getElementById('ans-'+idx);
  const ch=document.getElementById('chev-'+idx);
  if(!a) return;
  const open=a.classList.contains('open');
  a.classList.toggle('open',!open);
  if(ch) ch.classList.toggle('open',!open);
}
function mark(idx,yes){
  if(yes) got.add(idx); else got.delete(idx);
  render();
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentCat=btn.dataset.cat;
    render();
  });
});
document.getElementById('search').addEventListener('input',e=>{
  searchStr=e.target.value.toLowerCase().trim();
  render();
});

render();
</script>
</body>
</html>
